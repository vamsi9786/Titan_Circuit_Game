<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Titan's circuit</title>
    <link rel="stylesheet" href="style.css">
    <h2 > TITAN'S CIRCUIT </h2>
</head>
<body>
    <svg id="container" ></svg>
    <div id="game-board">
        <div id="points">
            <p> Red Titan Points : <span id="red-points">  0 </span> </p>
            <p> Blue Titan Points: <span id="blue-points"> 0 </span> </p>
        </div>
        <div>
            <svg id="outhex" viewbox="0 0 600 600" >
                <polygon points="50 300,175 83.5,425 83.5,550 300,425 516.5,175 516.5" fill="none" stroke="white" stroke-width="3"/>
                <text x="95" y="190" font-size="17" fill="white" font-weight="bold"> 2 </text>
                <text x="300" y="70" font-size="17" fill="white" font-weight="bold"> 1 </text>
                <text x="488.5" y="180" font-size="17" fill="white" font-weight="bold"> 2 </text>
                <text x="489.5" y="430" font-size="17" fill="white" font-weight="bold"> 1 </text>
                <text x="300" y="540" font-size="17" fill="white" font-weight="bold"> 1 </text>
                <text x="95" y="430" font-size="17" fill="white" font-weight="bold"> 3 </text>
                <line id="connline1" x1="50" y1="300" x2="110"y2="300" stroke="white" stroke-width="3"/>
                <text x="80" y="290" font-size="16" fill="white" font-weight="bold"> 1 </text>
                <line id="connline2" x1="425" y1="83.5" x2="397.95"y2="130" stroke="white" stroke-width="3"/>
                <text x="395" y="115" font-size="16" fill="white" font-weight="bold"> 1 </text>
                <line id="connline3" x1="425" y1="516.5" x2="397.75"y2="470" stroke="white" stroke-width="3"/>
                <text x="412" y="485" font-size="16" fill="white" font-weight="bold"> 1 </text>
                <circle id="n1" class="nodes" cx="50" cy="300" r="10" fill="#4b4b4b" stroke="white" stroke-width="1.6" />
                <circle id="n4" class="nodes" cx="550" cy="300" r="10" fill="#4b4b4b" stroke="white" stroke-width="1.6" />
                <circle id="n2" class="nodes" cx="175" cy="83.5" r="10" fill="#4b4b4b" stroke="white" stroke-width="1.6"/>
                <circle id="n3" class="nodes" cx="425" cy="83.5" r="10" fill="#4b4b4b" stroke="white" stroke-width="1.6"/>
                <circle id="n5" class="nodes" cx="425" cy="516.5" r="10" fill="#4b4b4b" stroke="white" stroke-width="1.6" />
                <circle id="n6" class="nodes" cx="175" cy="516.5" r="10" fill="#4b4b4b" stroke="white" stroke-width="1.6"/>
            </svg>

            <svg id="midhex" viewbox="0 0 600 600" >
                <polygon points="50 300,175 83.5,425 83.5,550 300,425 516.5,175 516.5" fill="none" stroke="white" stroke-width="4"/>
                <text x="95" y="190" font-size="21" fill="white" font-weight="bold"> 5 </text>
                <text x="300" y="70" font-size="21" fill="white" font-weight="bold"> 6 </text>
                <text x="488.5" y="180" font-size="21" fill="white" font-weight="bold"> 4 </text>
                <text x="489.5" y="430" font-size="21" fill="white" font-weight="bold"> 5 </text>
                <text x="300" y="540" font-size="21" fill="white" font-weight="bold"> 6 </text>
                <text x="95" y="430" font-size="21" fill="white" font-weight="bold"> 4 </text>
                <line id="connline4" x1="550" y1="300" x2="470"y2="300" stroke="white" stroke-width="4"/>
                <text x="500" y="290" font-size="19" fill="white" font-weight="bold"> 1 </text>
                <line id="connline5" x1="175" y1="83.5" x2="215"y2="150" stroke="white" stroke-width="4"/>
                <text x="204.75" y="120" font-size="19" fill="white" font-weight="bold"> 1 </text>
                <line id="connline6" x1="175" y1="516.5" x2="215"y2="450" stroke="white" stroke-width="4"/>
                <text x="185" y="480" font-size="19" fill="white" font-weight="bold"> 1 </text>
                <circle id="n7" class="nodes" cx="50" cy="300" r="13" fill="#4b4b4b" stroke="white" stroke-width="2" />
                <circle id="n10" class="nodes" cx="550" cy="300" r="13" fill="#4b4b4b" stroke="white" stroke-width="2" />
                <circle id="n8" class="nodes" cx="175" cy="83.5" r="13" fill="#4b4b4b" stroke="white" stroke-width="2"/>
                <circle id="n9" class="nodes" cx="425" cy="83.5" r="13" fill="#4b4b4b" stroke="white" stroke-width="2"/>
                <circle id="n11" class="nodes" cx="425" cy="516.5" r="13" fill="#4b4b4b" stroke="white" stroke-width="2" />
                <circle id="n12" class="nodes" cx="175" cy="516.5" r="13" fill="#4b4b4b" stroke="white" stroke-width="2"/>
            </svg>

            <svg id="inhex" viewbox="0 0 600 600" >
                <polygon points="50 300,175 83.5,425 83.5,550 300,425 516.5,175 516.5" fill="none" stroke="white" stroke-width="6"/>
                <text x="95" y="190" font-size="30" fill="white" font-weight="bold"> 8 </text>
                <text x="300" y="70" font-size="30" fill="white" font-weight="bold"> 8 </text>
                <text x="488.5" y="180" font-size="30" fill="white" font-weight="bold"> 9 </text>
                <text x="489.5" y="430" font-size="30" fill="white" font-weight="bold"> 8 </text>
                <text x="300" y="545" font-size="30" fill="white" font-weight="bold"> 8 </text>
                <text x="95" y="430" font-size="30" fill="white" font-weight="bold"> 9 </text>
                <circle id="n13" class="nodes" cx="50" cy="300" r="17" fill="#4b4b4b" stroke="white" stroke-width="3" />
                <circle id="n16" class="nodes" cx="550" cy="300" r="17" fill="#4b4b4b" stroke="white" stroke-width="3" />
                <circle id="n14" class="nodes" cx="175" cy="83.5" r="17" fill="#4b4b4b" stroke="white" stroke-width="3"/>
                <circle id="n15"class="nodes" cx="425" cy="83.5" r="17" fill="#4b4b4b" stroke="white" stroke-width="3"/>
                <circle id="n17" class="nodes" cx="425" cy="516.5" r="17" fill="#4b4b4b" stroke="white" stroke-width="3" />
                <circle id="n18" class="nodes" cx="175" cy="516.5" r="17" fill="#4b4b4b" stroke="white" stroke-width="3"/>
            </svg>
        </div>

        <div id="timer" width="180px" height="250px" display="inline-block">
            <p> Current Player : <span id="cur-player">  Red </span> </p>
            <p> Turn Timer : <span id="countdown">  30 sec </span></p>
            <p> Overall Timer : <span id="overalltimer"> 15:00 min </span> </p>
        </div>

        <div id="pause">
            <button width="30px" height="auto" display="inline-block" id="pause1" > &#9208;</button>
            <button width="30px" height="auto" display="inline-block" id="resume1" > &#9654;</button>
            <button width="30px" height="auto" display="inline-block" id="reset2" > &#8635;</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
